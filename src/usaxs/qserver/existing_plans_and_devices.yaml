      kind:
        name: POSITIONAL_OR_KEYWORD
        value: 1
      name: pos_Y
    - annotation:
        type: float
      description: Sample thickness in mm.
      kind:
        name: POSITIONAL_OR_KEYWORD
        value: 1
      name: thickness
    - annotation:
        type: str
      description: Human-readable title for the scan.
      kind:
        name: POSITIONAL_OR_KEYWORD
        value: 1
      name: scan_title
